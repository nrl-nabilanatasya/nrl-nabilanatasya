name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 */3 * *'   # every 3 days at 00:00 UTC
  workflow_dispatch:          # allows manual triggering

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ping Supabase (real DB query)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Querying Supabase database..."
          response=$(curl -s -w "\n%{http_code}" \
            -X GET "${SUPABASE_URL}/rest/v1/jm_categories?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          echo "Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" = "200" ]; then
            echo "Supabase DB query successful"
          else
            echo "Query failed with status: $http_code"
            exit 1
          fi

      - name: Keep workflow alive
        run: |
          # GitHub disables scheduled workflows after 60 days of repo inactivity
          # This dummy commit keeps the repo active
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date > .last-ping
          git add .last-ping
          git diff --cached --quiet || git commit -m "keep-alive: $(date -u '+%Y-%m-%d')" && git push
